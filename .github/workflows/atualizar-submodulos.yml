name: Atualizar Submodulos Automaticamente

on:
  # Executa automaticamente todos os dias às 00:00 (UTC)
  schedule:
    - cron: '0 0 * * *'
  # Permite que você execute manualmente com 1 clique quando quiser
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Atualizar referencias para os ultimos commits
        run: |
          git submodule update --init --recursive --remote
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend backend
          
          # Verifica se houve novidades antes de tentar comitar
          if git diff --staged --quiet; then
            echo "Nenhuma alteracao detectada nos submodulos."
          else
            git commit -m "chore(submodules): sincroniza com os ultimos commits [skip ci]"
            git push origin main
          fi
